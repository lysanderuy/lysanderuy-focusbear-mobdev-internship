[config]
auto_describe = true
auto_review = true
auto_improve = false

#################################
# PR DESCRIPTION CONFIGURATION
#################################

[describe]
generate_pr_title = true
use_bullets = true
max_description_tokens = 500

extra_instructions = """
Generate a clear, professional, and concise pull request description.

Use exactly the following structure and headings:

## What does this PR do?

## Why did you choose this solution?

## What is the dependency graph of the changes?

## How to test/verify?

Guidelines:
- Keep the content concrete and specific to the actual code changes.
- Do not use emojis.
- Keep tone professional.
- Avoid unnecessary verbosity.
- Do not repeat obvious information.
"""

#################################
# CODE REVIEW CONFIGURATION
#################################

[review]
extra_instructions = """
Review for:
- Code clarity and readability
- Clean structure and maintainability
- Best practices
- Potential bugs or edge cases

Provide concise, constructive, and actionable feedback.
Do not use emojis.
"""
