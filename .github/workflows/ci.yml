name: CI

on:
  pull_request:
    paths:
      - "**/*" # Trigger on any file changes

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ ESLint: JS/JSX/TS/TSX only
      - name: Run ESLint
        run: |
          npx eslint "**/*.{js,jsx,ts,tsx}" --ext .js,.jsx,.ts,.tsx

      # 5️⃣ Markdownlint (checks only Markdown formatting)
      - name: Run Markdownlint
        run: npx markdownlint "**/*.md"

      # 6️⃣ Spell check (Markdown only)
      - name: Run spell check
        run: npx cspell "**/*.md"
