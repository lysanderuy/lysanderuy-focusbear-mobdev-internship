name: CI

on:
  pull_request:
    paths:
      - "**/*" # Trigger on any file changes

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ ESLint: JS + JSX only
      - name: ESLint (JS/JSX in milestones)
        run: npx eslint "milestones/**/*.{js,jsx}" --ext .js,.jsx || true

      # 5️⃣ Markdownlint (existing .markdownlint.json)
      - name: Run Markdownlint
        run: npx markdownlint "**/*.md"

      # 6️⃣ Spell check
      - name: Run spell check
        run: npx cspell "milestones/**/*.md"
